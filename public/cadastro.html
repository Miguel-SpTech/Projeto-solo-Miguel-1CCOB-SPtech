<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
  <div class="divGeral">
     <div class="divEsquerda"></div>
     <div class="divDireita">
        <div class="registerBox">
           <button class="backBtn" onclick="back()">voltar</button> 
            <h1>Cadastro</h1>

            <div class="inputGroup">
            <label>Nome</label>
            <input type="text" placeholder="Digite seu Nome" id="inp_register_name">
            </div>

            <div class="inputGroup">
            <label>Nick</label>
            <input type="text" placeholder="Digite seu nickname" id="inp_register_nick">
            </div>

            <div class="inputGroup">
            <label>Email</label>
            <input type="email" placeholder="Digite seu email" id="inp_register_email">
            </div>

            <div class="inputGroup">
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha" id="inp_register_password">
            </div>

            <div class="inputGroup">
            <label>Confirmar Senha</label>
            <input type="password" placeholder="Confirme sua senha" id="inp_register_password_confirmation">
            </div>

            <div>
              <select name="" id="inp_register_fotoperfil">
                <option value="1">Red</option>
                <option value="2">Green</option>
                <option value="3">Blue</option>
              </select>
            </div>

            <button class="registerBtn">
            CADASTRAR
            </button>

            <div class="loginText">
            Já possui conta?
            <a href="login.html">Entrar</a>
        </div>
    </div>
    </div>
  </div>
</body>
</html>
<script src="js/login&cadastro.js"></script>
