<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de Troféus</title>
<link rel="stylesheet" href="../css/dashboards.css">
<link rel="stylesheet" href="../css/sidebar.css">

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body{
    background-color: #111;
    color: white;
    padding: 30px;
}

/* CONTAINER PRINCIPAL */
.trophy-room{
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

/* BARRA DE PROGRESSO */
.progress-container{
    width: 100%;
    height: 40px;
    background-color: #2b2b2b;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #555;
    margin-bottom: 30px;
    position: relative;
}

.progress-bar{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, gold, orange);
    transition: 0.5s;
}

.progress-text{
    position: absolute;
    width: 100%;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: bold;
}

/* GRID DOS TROFÉUS */
.trophy-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* CARD */
.trophy{
    height: 140px;
    background-color: #1e1e1e;
    border: 2px solid #444;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: 0.3s;
}

/* TROFÉU DESBLOQUEADO */
.trophy.unlocked{
    border-color: gold;
    box-shadow: 0 0 15px gold;
}

/* ÍCONE */
.trophy-icon{
    font-size: 40px;
    margin-bottom: 10px;
}

.trophy-name{
    font-size: 18px;
}

</style>
</head>
<body>

<div class="trophy-room">

    <!-- BARRA -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <!-- TROFÉUS -->
    <div class="trophy-grid" id="trophyGrid">
    </div>
    
</div>
<script src="../js/trophies.js"></script>
<script>

let trophyGrid = document.getElementById("trophyGrid");

let unlockedCount = 0;

/* CRIA OS TROFÉUS */
trophies.forEach(trophy => {

    let div = document.createElement("div");
    div.classList.add("trophy");

    if(trophy.unlocked){
        div.classList.add("unlocked");
        unlockedCount++;
    }

    div.innerHTML = `
        <div class="trophy-icon">
            ${trophy.unlocked ? "🏆" : "🔒"}
        </div>

        <div class="trophy-name">
            ${trophy.name}
        </div>
    `;

    trophyGrid.appendChild(div);

});

/* CALCULA PROGRESSO */
let progress = (unlockedCount / trophies.length) * 100;

document.getElementById("progressBar").style.width = progress + "%";

document.getElementById("progressText").innerText =
`${unlockedCount}/${trophies.length} (${Math.floor(progress)}%)`;



</script>
</body>
</html>
